<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232C5F43'><path d='M19 10.5h-4.5V6a1.5 1.5 0 0 0-3 0v4.5H7a1.5 1.5 0 0 0 0 3h4.5V18a1.5 1.5 0 0 0 3 0v-4.5H19a1.5 1.5 0 0 0 0-3z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C5F43" />
    <meta name="description" content="ShasthoSetu BD — live chamber serial tracking, e-prescriptions, DGDA medicine prices, blood donor and ICU bed directory for Bangladesh." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ShasthoSetu BD — OpenHealthBD</title>
    <!-- Google Fonts: Hind Siliguri for Bangla, Inter for English, JetBrains Mono for data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var lang = localStorage.getItem('shasthosetu_lang') || 'en';
          root.lang = lang;
          document.title = lang === 'bn'
            ? 'স্বাস্থ্যসেতু বিডি (ShasthoSetu BD) — ওপেনহেলথ বিডি'
            : 'ShasthoSetu BD — OpenHealthBD';
          var theme = localStorage.getItem('shasthosetu_theme') || 'light';
          var dark = theme === 'dark';
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.dataset.mood = localStorage.getItem('shasthosetu_mood') || 'setu';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
